name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 (Firebase emulators require Java 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # A build-only break (a bad import, a bundler-config slip) passes lint,
      # typecheck and tests but fails the web export — which otherwise only
      # surfaces at deploy time. Exporting here catches it in CI.
      - name: Web export (catch build-only breaks)
        run: npm run web:export -w @sabeel/app

      - name: Emulator integration tests
        run: npm run test:emulator
