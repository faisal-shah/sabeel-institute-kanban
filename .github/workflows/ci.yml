name: CI

# Exactly ONE run per change. An unfiltered `push:` produced two, twice over:
#
#   - Publishing a release pushes the vX.Y.Z TAG, and a tag push matched too —
#     so every release re-ran the whole suite, both e2e flows included, against
#     a commit main had already tested. It also made a flake look like a branch
#     difference: the same SHA failed on main and passed on the tag.
#   - `push` and `pull_request` both match a branch that has a PR open, so any
#     PR would double up as well.
#
# Restricting push to main leaves pull_request as the sole trigger for branch
# work, which is where review happens anyway.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 (Firebase emulators require Java 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # A build-only break (a bad import, a bundler-config slip) passes lint,
      # typecheck and tests but fails the web export — which otherwise only
      # surfaces at deploy time. Exporting here catches it in CI.
      - name: Web export (catch build-only breaks)
        run: npm run web:export -w @sabeel/app

      - name: Emulator integration tests
        run: npm run test:emulator

      # BOTH end-to-end suites, through the real web build.
      #
      # CI ran lint, typecheck, unit and emulator tests but never an e2e, which
      # is exactly why `web-e2e.mjs` rotted from check 5 to unusable without
      # anyone noticing: every control it clicked had been renamed by the move to
      # icon actions and the nav shell, and nothing failed until someone ran it
      # by hand. Both suites are green now, and both run on every push so that
      # cannot happen again. They are worth the minutes.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Attachments end-to-end (web)
        run: bash scripts/e2e.sh scripts/attachments-e2e.mjs

      - name: Access and board flow end-to-end (web)
        run: bash scripts/e2e.sh scripts/web-e2e.mjs

      # Added after it was found NOT to be running: 271 checks across nine
      # viewport widths, green locally and invisible to CI, which is the same
      # failure the comment above describes. `scripts/suite-coverage` now fails
      # if a new e2e script is ever left out of this list.
      - name: Stats chart end-to-end (web)
        run: bash scripts/e2e.sh scripts/stats-e2e.mjs

      # Every authenticated screen at five widths straddling the breakpoint.
      # Replaces four hand-run screenshot scripts that could not fail; the one it
      # most directly supersedes sat inside a try/catch that logged and continued.
      # Its first working run found Stats had shipped with no Back button and no
      # tab bar — a dead end on a phone browser.
      - name: Every screen, every width (web)
        run: bash scripts/e2e.sh scripts/screens-e2e.mjs

      # Rich text end to end: the editor, and what actually reaches Firestore.
      # The load-bearing check is three cycles of byte equality — a converter
      # that loses something loses it on cycle two, here rather than in
      # somebody's notes.
      - name: Rich text end-to-end (web)
        run: bash scripts/e2e.sh scripts/richtext-e2e.mjs
