name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 (Firebase emulators require Java 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^15

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # A build-only break (a bad import, a bundler-config slip) passes lint,
      # typecheck and tests but fails the web export — which otherwise only
      # surfaces at deploy time. Exporting here catches it in CI.
      - name: Web export (catch build-only breaks)
        run: npm run web:export -w @sabeel/app

      - name: Emulator integration tests
        run: npm run test:emulator

      # BOTH end-to-end suites, through the real web build.
      #
      # CI ran lint, typecheck, unit and emulator tests but never an e2e, which
      # is exactly why `web-e2e.mjs` rotted from check 5 to unusable without
      # anyone noticing: every control it clicked had been renamed by the move to
      # icon actions and the nav shell, and nothing failed until someone ran it
      # by hand. Both suites are green now, and both run on every push so that
      # cannot happen again. They are worth the minutes.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Attachments end-to-end (web)
        run: bash scripts/e2e.sh scripts/attachments-e2e.mjs

      - name: Access and board flow end-to-end (web)
        run: bash scripts/e2e.sh scripts/web-e2e.mjs
